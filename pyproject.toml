[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chase_tag"
version = "0.1.0"
description = "Drone Chase Tag: iki drone engelli arenada self-play RL ile ebelemece öğreniyor"
requires-python = ">=3.11"
dependencies = [
    "crazyflow==0.4.0",  # sürüm sabit: API notları CLAUDE.md'de
    "optax",
    "numpy",
    "scipy",     # arena bağlantılılık kontrolü (ndimage.label)
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
